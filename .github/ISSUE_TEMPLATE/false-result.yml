name: False positive / false negative
description: A rule reported something it should not have, or missed something it should have caught.
labels: [accuracy]
body:
  - type: markdown
    attributes:
      value: "If the issue lets crafted input hide a finding without signalling an incomplete scan, report it privately instead — see SECURITY.md."
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options: [False positive, False negative]
    validations: {required: true}
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: HX-WL-005
  - type: textarea
    id: manifest
    attributes:
      label: Minimal manifest
      description: Remove anything sensitive.
      render: yaml
    validations: {required: true}
  - type: textarea
    id: why
    attributes:
      label: Why the result is wrong
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: hardex version
