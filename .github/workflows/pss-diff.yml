name: pss-diff

# Differential test: random pods near each Pod Security Standards control,
# judged by both Hardex and the PodSecurity admission controller's own
# policy package (k8s.io/pod-security-admission). Every pod where they
# disagree at Baseline or Restricted fails the job, with the pod and both
# verdicts. A new seed each run; the seed is in the log for reproduction.
# See tools/pss-diff/README.md.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 2"

permissions:
  contents: read

jobs:
  pss-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/pss-diff/go.mod
          cache-dependency-path: tools/pss-diff/go.sum
      - name: Compare with k8s.io/pod-security-admission
        working-directory: tools/pss-diff
        run: |
          # go.mod and go.sum must be tidy; go mod tidy verifies new
          # checksums against sum.golang.org. If anything changed, the
          # files are also in annotations (gzip, base64), to be checked and
          # committed, since logs are not always at hand.
          touch go.sum
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum || [ -n "$(git ls-files --others -- go.sum)" ] || [ ! -s go.sum ]; then
            echo "::warning title=pss-diff go.mod::$(gzip -9c go.mod | base64 -w0)"
            echo "::warning title=pss-diff go.sum::$(gzip -9c go.sum | base64 -w0)"
            untidy=1
          fi
          set +e
          go test -count=1 -v ./... > pss-diff.log 2>&1
          status=$?
          set -e
          cat pss-diff.log
          grep -o 'seed [0-9]*' pss-diff.log | head -1 | sed 's/^/::notice title=pss-diff::/' || true
          n=$(grep -c ': pod .*PodSecurity allowed=' pss-diff.log || true)
          echo "::notice title=pss-diff::pods with differing verdicts: $n"
          # The first ten, each with its whole report, as annotations.
          awk '/: pod .*PodSecurity allowed=/{if(m!="")print m; m=$0; next} m!="" && /^        /{m=m"%0A"$0; next} {if(m!="")print m; m=""} END{if(m!="")print m}' pss-diff.log \
            | head -10 | sed 's/^ *//; s/^/::error title=pss-diff::/'
          if [ "$status" -ne 0 ] && [ "$n" -eq 0 ]; then
            echo "::error title=pss-diff::$(tail -30 pss-diff.log | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          [ -z "${untidy:-}" ] || { echo "::error title=pss-diff::go.mod or go.sum is not tidy (go mod tidy)"; exit 1; }
          exit $status
