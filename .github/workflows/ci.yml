name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs that need more request it explicitly.
permissions:
  contents: read

# CodeQL runs through GitHub's default code-scanning setup (repository
# Settings → Code security), which rejects a second, workflow-based CodeQL
# upload. It is therefore not configured here.

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned by commit SHA; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build and test with the latest supported Go release, so binaries and
      # the vulnerability scan include current standard-library security
      # fixes. go.mod's "go" line is only the minimum version for users.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: go version
      - run: make fmt vet
      - run: make test
      - run: make selfcheck
      - name: Kustomize overlay end-to-end
        run: kubectl version --client && make kustomize-check
      - name: Action defaults to the current version
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          grep -q "^    default: \"$v\"$" action.yml || { echo "::error::action.yml version default must be $v"; exit 1; }
          grep -q "ManintheiCloud/Hardex@v$v" README.md || { echo "::error::README action example must use v$v"; exit 1; }
      - name: Rule reference is up to date
        run: go run ./tools/gendocs && git diff --exit-code docs/rules.md
      - run: make vuln

  supply-chain:
    # Verifies the latest published release with the code under test, against
    # the real registry, Sigstore and OSV: keyless image signature discovery
    # (OCI referrers), SBOM attestations, and the signed release checksums.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Verify the published image and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          go build -o hardex ./cmd/hardex
          identity='^https://github.com/ManintheiCloud/Hardex/\.github/workflows/release\.yml@refs/(tags/v|heads/main)'
          issuer=https://token.actions.githubusercontent.com
          ./hardex images --image ghcr.io/manintheicloud/hardex:latest --require-signature --vulns --format json \
            --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" > images.json
          # Surface the result as annotations, readable without the job log.
          jq -r '.[] | "::notice title=\(.image)::signature \(.signature.status) \(.signature.key // "") \(.signature.detail // ""); SBOM \(.vulnerabilities.sbom // false), \(.vulnerabilities.packages // 0) packages, findings \((.vulnerabilities.findings // []) | map(.purl + " " + (.vulnerabilities | join(","))) | join("; "))"' images.json
          jq -r '.[] | .signature.verified[]? | "::notice title=verified::\(.)"' images.json
          # Require the SLSA build provenance specifically.
          ./hardex images --image ghcr.io/manintheicloud/hardex:latest --require-signature \
            --predicate-type https://slsa.dev/provenance/v1 \
            --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" > /dev/null
          # ...and cosign's own image signature (a cosign v3 sign attestation).
          ./hardex images --image ghcr.io/manintheicloud/hardex:latest --require-signature \
            --predicate-type https://sigstore.dev/cosign/sign/v1 \
            --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" > /dev/null
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS*' --dir rel
          ./hardex verify-blob rel/SHA256SUMS --bundle rel/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer"

  fuzz:
    # Short fuzzing runs of every parser that sees untrusted or operator
    # input. Crashing inputs are uploaded so they can be added to the seed
    # corpus as regression tests.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - {name: FuzzLoad, pkg: ./core/resource}
          - {name: FuzzParseConfig, pkg: ./core/policy}
          - {name: FuzzParse, pkg: ./core/modules}
          - {name: FuzzServeHTTP, pkg: ./integrations/admission}
          - {name: FuzzParseFlags, pkg: ./kubernetes/controlplane}
          - {name: FuzzVerify, pkg: ./core/sigstore}
          - {name: FuzzRFC3161, pkg: ./core/sigstore}
          - {name: FuzzParse, pkg: ./core/cloudiam}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: go test -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 60s ${{ matrix.target.pkg }}

  minimum-go:
    # Confirm the module still builds and passes on the minimum Go version
    # declared in go.mod.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
