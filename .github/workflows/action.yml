name: action

# Tests the Hardex GitHub Action (action.yml) on every hosted runner type:
# release download, checksum and provenance verification, scan, SARIF.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release to test with
        id: release
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # The action's default release. A pull request that bumps it (a
          # release PR) cannot see it yet: the release is built after the
          # merge. Such a PR tests the action with the latest published
          # release instead; pushes to main wait for the new one.
          v="$(sed -n 's/^    default: "\([0-9][0-9.]*\)"$/\1/p' action.yml | head -1)"
          published() { curl -sfIL -o /dev/null "https://github.com/ManintheiCloud/Hardex/releases/download/v$1/SHA256SUMS"; }
          if [ "$EVENT" = pull_request ] && ! published "$v"; then
            latest="$(curl -sfIL -o /dev/null -w '%{url_effective}' https://github.com/ManintheiCloud/Hardex/releases/latest | sed 's#.*/tag/v##')"
            echo "v$v is not published yet (release pull request); testing with v$latest"
            v="$latest"
          fi
          for i in $(seq 1 40); do
            if published "$v"; then echo "version=$v" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "waiting for release v$v ($i)"; sleep 30
          done
          echo "release v$v not published"; exit 1
      - name: Clean manifests pass
        uses: ./
        with:
          version: ${{ steps.release.outputs.version }}
          paths: tests/fixtures/hardened
          profile: restricted
          output: hardened.sarif
      - name: Insecure manifests fail
        id: insecure
        uses: ./
        continue-on-error: true
        with:
          version: ${{ steps.release.outputs.version }}
          paths: tests/fixtures/insecure
          output: insecure.sarif
      - name: Check results
        shell: bash
        env:
          CODE: ${{ steps.insecure.outputs.exit-code }}
          REPORT: ${{ steps.insecure.outputs.report }}
        run: |
          set -euo pipefail
          [ "$CODE" = 1 ] || { echo "expected exit code 1 for insecure manifests, got '$CODE'"; exit 1; }
          n="$(jq '.runs[0].results | length' "$REPORT")"
          [ "$n" -gt 20 ] || { echo "expected SARIF results, got $n"; exit 1; }
          jq -e '.version == "2.1.0" and (.runs[0].tool.driver.rules | length) > 40' "$REPORT" >/dev/null
          echo "SARIF ok: $n results"
