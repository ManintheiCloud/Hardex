name: release

# Prepares a release when the VERSION file changes on main (the release
# tag v<VERSION> is created by this workflow), or when a version tag
# (v1.2.3) is pushed, and publishes it once a reviewer approves the run
# (the "release" environment):
#   - binaries for Linux, macOS and Windows, with SHA256SUMS
#   - an SPDX SBOM
#   - a keyless Sigstore signature over SHA256SUMS
#   - GitHub build-provenance attestations (SLSA) for every artifact
#   - a multi-arch container image on ghcr.io, signed and attested
# Verification instructions: docs/verifying-releases.md

on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*.*.*"]
  # Recovery when GitHub drops the push event: start the release of the
  # current VERSION by hand, from main only (checked below). It still waits
  # for a reviewer, and an existing release is never rebuilt.
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/manintheicloud/hardex

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::manual releases run from main only (this run: $GITHUB_REF)"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "invalid version '$version'" >&2; exit 1
          fi
          release=true
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$version already exists; nothing to do"
            release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: main and release tags are protected as committed
        # A release is signed as release.yml on refs/heads/main; that only
        # means "reviewed and tested" while the rulesets hold.
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/check-rulesets.py "$GITHUB_REPOSITORY"

  test:
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: make fmt vet test selfcheck vuln
      - name: Embedded Sigstore trusted root is current
        run: tools/update-trusted-root.sh

  # A person approves every release. The "release" environment requires a
  # reviewer (repository settings; checked by tools/check-rulesets.py), so
  # the publishing jobs below wait here until someone approves the run in
  # GitHub. Building and testing above happen without approval; nothing is
  # signed, tagged or published before it.
  approve:
    needs: [meta, test]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      # Checked after approval, against what is published at that moment: a
      # run approved late must not publish an older version over a newer one
      # (the "latest" release and the image's :latest tag would move back).
      - name: Not older than the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          latest="${latest#v}"
          if [ -n "$latest" ] && [ "$latest" != "$VERSION" ] && \
             [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -1)" = "$latest" ]; then
            echo "::error::v$latest is already published; refusing to publish the older v$VERSION"
            exit 1
          fi
          echo "Release v$VERSION approved (latest published: v${latest:-none})"

  binaries:
    needs: [meta, test, approve]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Build
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="hardex_${version}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/ManintheiCloud/Hardex.Version=${version}" \
              -o "build/$name/hardex$ext" ./cmd/hardex
            cp LICENSE NOTICE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/hardex.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # Checksums after the SBOM, so SHA256SUMS covers every published file.
      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/hardex.spdx.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hardex $TAG" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md). Container image: \`${IMAGE}:${VERSION}\`. How to verify: [docs/verifying-releases.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/verifying-releases.md)."

  image:
    needs: [meta, test, approve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ needs.meta.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
