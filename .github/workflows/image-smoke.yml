name: image-smoke

# Confirms the published image is publicly pullable without credentials,
# runs, reports the expected version, and carries a valid keyless signature
# from this repository's release workflow.

# Runs only after a release has finished (and weekly), so it never races a
# release that is still publishing the image.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Anonymous pull and run
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          image="ghcr.io/manintheicloud/hardex:${version}"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "$image"
          out="$(docker run --rm "$image" version)"
          echo "$out"
          [ "$out" = "hardex ${version}" ]
          docker run --rm -v "$PWD/tests/fixtures:/in:ro" "$image" scan --profile minimal --fail-on none /in/insecure | tail -1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify signature
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          cosign verify "ghcr.io/manintheicloud/hardex:${version}" \
            --certificate-identity-regexp '^https://github.com/ManintheiCloud/Hardex/\.github/workflows/release\.yml@refs/(tags/v|heads/main)' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature verified"
      - name: Verify with Hardex itself (keyless image signature, release checksums, SBOM vulnerabilities)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          image="ghcr.io/manintheicloud/hardex:${version}"
          identity='^https://github.com/ManintheiCloud/Hardex/\.github/workflows/release\.yml@refs/(tags/v|heads/main)'
          issuer=https://token.actions.githubusercontent.com
          docker run --rm "$image" images --image "$image" --require-signature --vulns \
            --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer"
          for pt in https://sigstore.dev/cosign/sign/v1 https://slsa.dev/provenance/v1; do
            docker run --rm "$image" images --image "$image" --require-signature --predicate-type "$pt" \
              --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" > /dev/null
            echo "verified $pt"
          done
          mkdir -p rel
          gh release download "v${version}" --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS*' --dir rel
          docker run --rm -v "$PWD/rel:/rel:ro" "$image" verify-blob /rel/SHA256SUMS --bundle /rel/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer"
      - name: Verify every release artifact (checksums, signature, provenance)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          commit="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" | cut -f1)"
          mkdir -p all && cd all
          gh release download "$tag" --repo "$GITHUB_REPOSITORY"
          # Every published file except the checksum file and its signature
          # must be listed in SHA256SUMS, and match it.
          for f in *; do
            case "$f" in SHA256SUMS|SHA256SUMS.sigstore.json) continue ;; esac
            grep -q "  $f\$" SHA256SUMS || { echo "::error::$f is not covered by SHA256SUMS"; exit 1; }
          done
          sha256sum -c SHA256SUMS
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp '^https://github.com/ManintheiCloud/Hardex/\.github/workflows/release\.yml@refs/(tags/v|heads/main)' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          # SLSA provenance for every archive and the SBOM, built from the
          # tagged commit by the release workflow.
          for f in *.tar.gz *.zip hardex.spdx.json; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$commit" > /dev/null
            echo "provenance OK: $f"
          done
          gh attestation verify "oci://ghcr.io/manintheicloud/hardex:${version}" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$commit" > /dev/null
          echo "provenance OK: ghcr.io/manintheicloud/hardex:${version}"
