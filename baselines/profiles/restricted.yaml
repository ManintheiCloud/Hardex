# Hardex profile: restricted
#
# Every built-in rule. Aligns workloads with the Pod Security Standards
# Restricted level and adds defence-in-depth controls. Expect application
# changes (non-root images, read-only filesystems, explicit resource limits).
name: restricted
description: All built-in rules; defence in depth for high-security environments.
rules:
