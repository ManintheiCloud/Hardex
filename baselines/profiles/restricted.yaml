  - HX-WL-005 # non-root
  - HX-WL-007 # minimal capabilities
  - HX-WL-009 # read-only root filesystem
  - HX-WL-010 # resource limits
  - HX-WL-012 # image digest pinning
  - HX-WL-013 # service account token automount
  - HX-WL-019 # volume types
