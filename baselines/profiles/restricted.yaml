  - HX-WL-006
  - HX-WL-015
  - HX-WL-016
  - HX-WL-017
  - HX-WL-020
  - HX-WL-022 # host-access workloads in kube-system (info)
  - HX-RBAC-002
  - HX-RBAC-004
  - HX-RBAC-007
  - HX-RBAC-008
  - HX-PATH-001
  - HX-PATH-002
  - HX-CP-002
  - HX-CP-006
  - HX-NODE-001
  - HX-NODE-002
  - HX-WL-008
  - HX-WL-011
  - HX-WL-014
  - HX-WL-021
  - HX-WL-018
  - HX-SEC-001
  - HX-SEC-002
  - HX-SEC-003
  - HX-RBAC-001
  - HX-RBAC-003
  - HX-RBAC-005
  - HX-NET-001
  - HX-NET-003
