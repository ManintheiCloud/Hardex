apiVersion: v1
kind: Service
metadata:
  name: public-lb
  namespace: shop
spec:
  type: LoadBalancer
  selector: {app: insecure-web}
  ports: [{port: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: node-port
  namespace: shop
spec:
  type: NodePort
  selector: {app: insecure-web}
  ports: [{port: 80, nodePort: 30080}]
---
apiVersion: v1
kind: Service
metadata:
  name: hijack
  namespace: shop
spec:
  selector: {app: insecure-web}
  externalIPs: ["8.8.8.8"]
  ports: [{port: 53}]
