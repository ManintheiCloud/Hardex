apiVersion: v1
kind: Service
metadata:
  name: public-lb
  namespace: shop
spec:
  type: LoadBalancer
  selector: {app: insecure-web}
  ports: [{port: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: node-port
  namespace: shop
spec:
  type: NodePort
  selector: {app: insecure-web}
  ports: [{port: 80, nodePort: 30080}]
---
apiVersion: v1
kind: Service
metadata:
  name: hijack
  namespace: shop
spec:
  selector: {app: insecure-web}
  externalIPs: ["8.8.8.8"]
  ports: [{port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plain-http
  namespace: shop
spec:
  rules:
    - host: shop.example.com
      http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: public-lb, port: {number: 80}}}}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: partial-tls
  namespace: shop
spec:
  tls:
    - hosts: [shop.example.com]
      secretName: shop-tls
  rules:
    - host: shop.example.com
    - host: admin.example.org
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: policy-engine
webhooks:
  - name: validate.policy.example.com
    failurePolicy: Ignore
    sideEffects: None
    admissionReviewVersions: [v1]
    clientConfig: {service: {name: policy, namespace: policy}}
    rules:
      - {apiGroups: [""], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [pods]}
