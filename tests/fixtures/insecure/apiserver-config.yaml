# Structured API server configuration files, as found next to the static
# pod manifests. Like the real files they have no metadata; Hardex names
# them after the file.
apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources: [secrets]
    providers:
      - identity: {}
      - aescbc:
          keys:
            - {name: key1, secret: c2VjcmV0IGlzIHNlY3VyZSwgYnV0IG5vdCB1c2VkIGZpcnN0}
---
apiVersion: apiserver.config.k8s.io/v1
kind: AuthenticationConfiguration
anonymous:
  enabled: true
  conditions:
    - path: /livez
    - path: /api
---
apiVersion: apiserver.config.k8s.io/v1
kind: AuthorizationConfiguration
authorizers:
  - type: Node
    name: node
  - type: AlwaysAllow
    name: everyone
